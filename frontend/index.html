<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Terminal</title>
<link rel="stylesheet" href="/css/style.css" />
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>

<header id="topbar">
  <div class="brand">Terminal</div>
  <nav id="tabnav">
    <button class="tab-btn active" data-tab="chart">Chart</button>
    <button class="tab-btn" data-tab="optionchain">Option chain</button>
    <button class="tab-btn" data-tab="analytics">Analytics</button>
    <button class="tab-btn" data-tab="strategy">Strategy builder</button>
    <button class="tab-btn" data-tab="positions">Positions</button>
  </nav>
  <div class="topbar-right">
    <span id="connStatus" class="pill pill-muted">connecting…</span>
    <span id="paperBadge" class="pill pill-warning">paper mode</span>
  </div>
</header>

<main id="tabpanels">

  <section id="tab-chart" class="tabpanel active">
    <div class="chart-toolbar">
      <select id="chartUnderlying">
        <option value="NIFTY">NIFTY</option>
        <option value="BANKNIFTY">BANKNIFTY</option>
        <option value="FINNIFTY">FINNIFTY</option>
        <option value="SENSEX">SENSEX</option>
      </select>
      <input id="chartToken" type="number" placeholder="Instrument token" style="width:130px" />
      <select id="chartExchange" style="width:80px">
        <option value="NSE">NSE</option>
        <option value="NFO">NFO</option>
        <option value="BSE">BSE</option>
        <option value="BFO">BFO</option>
        <option value="MCXFO">MCXFO</option>
      </select>
      <select id="chartInterval">
        <option value="min">1 min</option>
        <option value="3min">3 min</option>
        <option value="5min" selected>5 min</option>
        <option value="15min">15 min</option>
        <option value="hour">1 hour</option>
        <option value="day">1 day</option>
      </select>
      <button id="chartLoadBtn">Load</button>
      <span class="divider"></span>
      <button class="chip" data-ind="ma">MA</button>
      <button class="chip" data-ind="supertrend">Supertrend</button>
      <button class="chip" data-ind="cpr">CPR</button>
      <button class="chip" data-ind="volume_profile">Volume profile</button>
      <button class="chip" data-ind="rsi">RSI</button>
      <button class="chip" data-ind="macd">MACD</button>
    </div>

    <div class="chart-body">
      <div class="chart-main">
        <div id="priceChart" class="chart-canvas chart-canvas-tall"></div>
        <div id="rsiChart" class="chart-canvas chart-canvas-short hidden"></div>
        <div id="macdChart" class="chart-canvas chart-canvas-short hidden"></div>
      </div>

      <aside class="chart-side">
        <div class="panel">
          <div class="panel-title">Market depth</div>
          <table class="depth-table" id="depthTable">
            <thead><tr><th>Bid qty</th><th>Price</th><th>Ask qty</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="panel">
          <div class="panel-title">Order ticket</div>
          <form id="orderTicketForm">
            <input type="hidden" name="exchange" value="NSE" />
            <input name="symbol" placeholder="Symbol e.g. RELIANCE-EQ" required />
            <div class="row">
              <input name="quantity" type="number" placeholder="Qty" value="1" required style="width:70px" />
              <select name="product">
                <option value="MIS">MIS</option>
                <option value="NRML">NRML</option>
                <option value="CNC">CNC</option>
              </select>
            </div>
            <div class="row">
              <select name="order_type">
                <option value="MARKET">Market</option>
                <option value="LIMIT">Limit</option>
                <option value="STOP_LOSS_LIMIT">SL Limit</option>
                <option value="STOP_LOSS_MARKET">SL Market</option>
              </select>
              <input name="price" type="number" step="0.05" placeholder="Price" style="width:90px" />
            </div>
            <div class="row buysell">
              <button type="submit" data-side="BUY" class="btn-buy">Buy</button>
              <button type="submit" data-side="SELL" class="btn-sell">Sell</button>
            </div>
          </form>
          <div id="orderTicketResult" class="hint"></div>
        </div>
      </aside>
    </div>
  </section>

  <section id="tab-optionchain" class="tabpanel"></section>
  <section id="tab-analytics" class="tabpanel"></section>
  <section id="tab-strategy" class="tabpanel"></section>
  <section id="tab-positions" class="tabpanel"></section>

</main>

<script src="/js/api.js"></script>
<script src="/js/ws.js"></script>
<script src="/js/chart.js"></script>
<script src="/js/optionChain.js"></script>
<script src="/js/analytics.js"></script>
<script src="/js/strategyBuilder.js"></script>
<script src="/js/positions.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
